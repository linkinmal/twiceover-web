.k-tick{fill:#8A5A12;font-family:"Source Serif 4", Georgia, Cambria, "Times New Roman", serif;font-weight:600;font-size:15.30px;letter-spacing:0.5px}
.k-sub{fill:#60594F;font-family:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13.01px}
.k-hit{fill:transparent}
</style>
<rect width="1200" height="630" fill="#F7F3EA"/>
