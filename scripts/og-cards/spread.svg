<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
.word{font-family:"Source Serif 4", Georgia, Cambria, "Times New Roman", serif;font-weight:600;font-size:32px;fill:#211D17}
.o{fill:#23436F}
.tagline{font-family:"Source Serif 4", Georgia, Cambria, "Times New Roman", serif;font-weight:600;font-size:46px;letter-spacing:-1.15px;fill:#211D17}
.cap{font-family:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:24px;fill:#60594F}
.disc{font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:28px;fill:#6B6358}
.foot{font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-weight:600;font-size:22px;fill:#2F5C97}
.foot-right{font-family:"Source Serif 4", Georgia, Cambria, "Times New Roman", serif;font-weight:600;font-size:24px;fill:#211D17}
text{font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif}
.pf-hatch{stroke:#6B6358;stroke-width:1;opacity:0.55}
.pf-zone-profit{fill:#211D17;opacity:0.05}
.pf-word{fill:#4C463D;font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:19.95px;font-weight:600;paint-order:stroke;stroke:#F7F3EA;stroke-width:3px;stroke-linejoin:round}
.pf-grid{stroke:#E2DCCF;stroke-width:1;opacity:0.28}
.pf-zero{stroke:#CFC7B6;stroke-width:1}
.pf-line{fill:none;stroke:#211D17;stroke-width:2.2;stroke-linejoin:round}
.pf-berule{stroke:#6B6358;stroke-width:1.2;stroke-dasharray:4 4}
.pf-bedot{fill:#F7F3EA;stroke:#211D17;stroke-width:1.6}
.pf-maxloss-d{fill:#F7F3EA;stroke:#211D17;stroke-width:1.6}
.pf-maxprof-d{fill:#211D17;stroke:#F7F3EA;stroke-width:2}
.pf-tick--strike{stroke:#211D17}
.pf-tick--breakeven{stroke:#4C463D}
.pf-tickfig{font-family:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:17.10px}
.pf-tickfig--strike{fill:#211D17}
.pf-tickfig--breakeven{fill:#4C463D}
</style>
<rect width="1200" height="630" fill="#F7F3EA"/>
<g transform="translate(80 46) scale(1.3125)"><rect x="5" y="11" width="22" height="3.4" rx="1.7" fill="#23436F"/><rect x="10" y="18" width="17" height="3.4" rx="1.7" fill="#23436F" opacity="0.55"/></g>
<text class="word" x="135" y="78">Twice<tspan class="o">O</tspan>ver</text>
<text class="tagline" x="80" y="132">A second look</text>
<text class="tagline" x="80" y="180.75">at your own book.</text>
<text class="cap" x="80" y="250">your 2× Jul 17 175C/190C · breakeven $181.20</text>
<text class="disc" text-anchor="end" x="1120" y="358">Illustrative example —</text>
<text class="disc" text-anchor="end" x="1120" y="394.39">not a live account</text>
