name: ci

# Build + content gate (#39 AC3/AC4): fails on banned terms or a missing/altered
# shared disclaimer in the built HTML — the same output-contract line as product output.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
